plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.zhongbai233.sceneeditor'
version = rootProject.scene_editor_version

def isolatedBuildRoot = rootProject.providers.gradleProperty('ncpbBuildDirectory').orElse('').get().trim()
if (!isolatedBuildRoot.isEmpty()) {
    layout.buildDirectory = new File(isolatedBuildRoot, project.name)
}

base {
    archivesName = 'scene-editor-minecraft'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

neoForge {
    version = rootProject.neo_version
}

dependencies {
    api project(':scene-editor-core')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.zhongbai233.sceneeditor.minecraft',
                // This adapter links against transformed Minecraft classes and must therefore live in the game layer.
                // A plain LIBRARY is loaded by the application loader and causes duplicate-Minecraft linkage errors.
                'FMLModType': 'GAMELIBRARY',
                'Implementation-Title': 'Scene Editor Minecraft Adapter',
                'Implementation-Version': project.version)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'scene-editor-minecraft'
            from components.java
            pom {
                name = 'Scene Editor Minecraft Adapter'
                description = 'Minecraft GUI/input/lifecycle adapters for Scene Editor Core.'
            }
        }
    }
    repositories {
        maven {
            name = 'phase8Verification'
            url = rootProject.layout.buildDirectory.dir('phase8-maven-repository')
        }
    }
}
