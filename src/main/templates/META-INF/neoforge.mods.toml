modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/zhongbai2333/NetMusicCanPlayBili/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/zhongbai2333/NetMusicCanPlayBili"
authors = "${mod_authors}"
description = """${mod_description}"""
logoFile = "logo.png"
enumExtensions = "META-INF/enumextensions.json"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "netmusic"
type = "required"
versionRange = "[1.5.1,)"
ordering = "AFTER"
side = "BOTH"
reason = "Provides the computer, CD burner and music discs used by this add-on."

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "curios"
type = "optional"
versionRange = "[12,)"
ordering = "AFTER"
side = "BOTH"
reason = "Adds head accessory slots for headphones and holographic glasses."

[[dependencies."${mod_id}"]]
modId = "area_control"
type = "optional"
ordering = "AFTER"
side = "BOTH"
reason = "Applies AreaControl's acoustic boundaries to public audio."
