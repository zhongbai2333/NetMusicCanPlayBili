def productionJarArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyProductionJarHasNoConflictCopies') {
    group = 'verification'
    description = 'Verifies the production JAR contains no cloud-sync conflict-copy files.'
    dependsOn tasks.named('jar')
    inputs.file(productionJarArchive)
    doLast {
        def archive = inputs.files.singleFile
        def conflicts = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            conflicts.addAll(zip.entries().findAll { entry ->
                !entry.directory && entry.name.tokenize('/').last() ==~ /.* \d+\.[^.]+/
            }.collect { entry -> entry.name })
        }
        if (!conflicts.isEmpty()) {
            throw new GradleException("Production JAR contains conflict-copy files: ${conflicts.sort()}")
        }
    }
}

tasks.register('verifySceneEditorJiJ') {
    group = 'verification'
    description = 'Verifies scene-editor core/Minecraft artifacts are present exactly once as negotiable JiJ libraries.'
    dependsOn tasks.named('jar')
    inputs.file(productionJarArchive)
    inputs.property('sceneEditorVersion', scene_editor_version)
    doLast {
        def archive = inputs.files.singleFile
        def expectedVersion = inputs.properties['sceneEditorVersion'].toString()
        def expected = [
                'scene-editor-core'     : [module: 'com.zhongbai233.sceneeditor.core', type: 'LIBRARY'],
                'scene-editor-minecraft': [module: 'com.zhongbai233.sceneeditor.minecraft', type: 'GAMELIBRARY']
        ]
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def outerClasses = zip.entries().findAll { entry ->
                !entry.directory && entry.name.endsWith('.class')
                        && entry.name.startsWith('com/zhongbai233/scene_editor/')
            }.collect { it.name }
            if (!outerClasses.isEmpty()) {
                throw new GradleException("Scene Editor classes must only exist in nested JiJ artifacts: ${outerClasses}")
            }

            def metadataEntry = zip.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('Production JAR is missing META-INF/jarjar/metadata.json')
            }
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
            def sceneEntries = metadata.jars.findAll { jar ->
                jar.identifier.group == 'com.github.zhongbai2333.SceneEditor'
            }
            if (sceneEntries.size() != expected.size()) {
                throw new GradleException("Expected exactly ${expected.size()} Scene Editor JiJ entries, got ${sceneEntries}")
            }
            expected.each { artifact, contract ->
                def matches = sceneEntries.findAll { jar -> jar.identifier.artifact == artifact }
                if (matches.size() != 1) {
                    throw new GradleException("Expected one JiJ entry for ${artifact}, got ${matches}")
                }
                def descriptor = matches[0]
                if (descriptor.version.artifactVersion != expectedVersion
                        || descriptor.version.range != '[1.0.0-beta.2,2.0.0)') {
                    throw new GradleException("Unexpected ${artifact} JiJ version contract: ${descriptor.version}")
                }
                def nestedEntry = zip.getEntry(descriptor.path)
                if (nestedEntry == null) {
                    throw new GradleException("Missing nested JiJ artifact ${descriptor.path}")
                }
                zip.getInputStream(nestedEntry).withCloseable { nestedInput ->
                    new java.util.jar.JarInputStream(nestedInput).withCloseable { nestedJar ->
                        def attributes = nestedJar.manifest?.mainAttributes
                        if (attributes?.getValue('FMLModType') != contract.type
                                || attributes?.getValue('Automatic-Module-Name') != contract.module
                                || attributes?.getValue('Implementation-Version') != expectedVersion) {
                            throw new GradleException("Invalid ${artifact} library manifest: ${attributes}")
                        }
                    }
                }
            }
        }
    }
}

