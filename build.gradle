    publications {
        register('mavenJava', MavenPublication) {
            from(components.java)
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

// 让 IDE 可下载依赖源码和 Javadoc，便于跳转。
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ModBench 创建 bench source set；显式加入 Buildship 模型，VS Code 才能解析其 API 和 Minecraft classpath。
eclipse {
    classpath {
        if (modBenchEnabled) {
            sourceSets += [sourceSets.bench]
        }
    }
}
