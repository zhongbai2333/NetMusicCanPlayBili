buildscript {
    if (providers.gradleProperty('enableModBench').map { it.toBoolean() }.orElse(false).get()) {
        repositories {
            if (providers.gradleProperty('ncpbLocalModBench').map { it.toBoolean() }.orElse(false).get()) {
                mavenLocal {
                    content { includeGroup 'com.github.zhongbai2333.BenchMod' }
                }
            }
            maven {
                url = 'https://jitpack.io'
                content {
                    includeGroup 'com.github.zhongbai2333.BenchMod'
                }
            }
        }
        dependencies {
            classpath "com.github.zhongbai2333.BenchMod:bench-gradle-plugin:${providers.gradleProperty('modbench_version').get()}"
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

// Opt in to a build directory outside cloud-synchronised workspaces. Providers may restore
// conflict-copy class files while Gradle snapshots task outputs, which can otherwise keep a
// build busy indefinitely. Normal local and CI builds retain Gradle's default build directory.
def isolatedBuildDirectory = providers.gradleProperty('ncpbBuildDirectory')
        .map { it.trim() }
        .orElse('')
        .get()
if (!isolatedBuildDirectory.isEmpty()) {
    layout.buildDirectory = file(isolatedBuildDirectory)
}

def modBenchEnabled = providers.gradleProperty('enableModBench')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def terrainCompatMatrixRequested = providers.gradleProperty('enableTerrainCompatMatrix')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def realMediaLifecycleRequested = providers.gradleProperty('ncpbRealMediaLifecycle')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
if (terrainCompatMatrixRequested && !modBenchEnabled) {
    throw new GradleException('-PenableTerrainCompatMatrix=true requires -PenableModBench=true')
}
if (realMediaLifecycleRequested && !modBenchEnabled) {
    throw new GradleException('-PncpbRealMediaLifecycle=true requires -PenableModBench=true')
}
def terrainCompatMatrixEnabled = modBenchEnabled && terrainCompatMatrixRequested
def realMediaLifecycleEnabled = modBenchEnabled && realMediaLifecycleRequested
def terrainCompatAssetManifestFile = layout.projectDirectory.file('tools/terrain_compat_matrix_assets.json')
def terrainCompatNeoForgeVersion = neo_version.toString()
def terrainCompatAssetDirectory = providers.gradleProperty('ncpbTerrainCompatAssetDirectory')
        .map { file(it) }
        .orElse(layout.buildDirectory.dir('terrainCompatAssets').map { it.asFile })
if (modBenchEnabled) {
    apply plugin: 'com.zhongbai233.minecraft-bench'
    tasks.named('processBenchResources', ProcessResources).configure {
        from('src/test/resources') {
            include 'bili/real-av1/**'
        }
    }
}

repositories {
    if (providers.gradleProperty('ncpbLocalModBench').map { it.toBoolean() }.orElse(false).get()) {
        mavenLocal {
            content { includeGroup 'com.github.zhongbai2333.BenchMod' }
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.zhongbai2333.BenchMod'
            includeGroup 'com.github.zhongbai2333.SceneEditor'
        }
    }
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

// Mouse input routing moved to LocalPlayerRoamingMixin. Incremental builds can retain the
// old class file after the source rename, so never package that obsolete mixin in releases.
// Cloud file providers can also restore conflict copies such as "Handler 2.class" under
// build/classes. A legal JVM binary name cannot contain a space, so keep those out of jars.
tasks.withType(Jar).configureEach {
    exclude 'com/zhongbai233/net_music_can_play_bili/mixin/MouseHandlerRoamingMixin.class'
    exclude 'com/zhongbai233/net_music_can_play_bili/mixin/LocalPlayerRoamingMixin.class'
    // File-provider conflict copies use names such as "foo 2.class", "bar 3.json" or
    // "native 4.dylib". Exclude every such generated copy, not only Java classes.
    exclude { details -> details.file.name ==~ /.* \d+\.[^.]+/ }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // NeoForge 版本。
    version = project.neo_version

    // Access Transformer 会自动检测；通常无需手动添加。
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // 本地运行配置。
    runs {
        client {
            client()

            // Java 25 对 System.load 等 native 入口要求显式授权；FFmpeg/EAC3 解码器由本模组加载。
            jvmArgument "--enable-native-access=${mod_id}"

            def prop = { name, defaultValue -> providers.gradleProperty(name).orElse(defaultValue).get() }
            def jvmProp = { key, value -> jvmArgument "-D${key}=${value}" }

            // 限定 GameTest 命名空间，减少开发客户端扫描量。
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 正式播放默认走 NV12 direct-buffer + PBO + shader；Bench 均默认关闭，按需用 -P... 显式打开。
            jvmProp 'ncpb.video.advanced_features', prop('ncpbVideoAdvancedFeatures', 'false')
            jvmProp 'ncpb.video.enable_bench_features', prop('ncpbVideoBenchFeatures', 'false')
            jvmProp 'ncpb.video.render.backend', prop('ncpbVideoRenderBackend', 'nv12')

            // 内存诊断：低频输出 JVM、进程提交以及本模组显式 native/PBO 分配。
            jvmProp 'ncpb.memory.diagnostics', prop('ncpbMemoryDiagnostics', 'false')
            jvmProp 'ncpb.memory.report_interval_ms', prop('ncpbMemoryReportIntervalMs', '5000')
            // 媒体资源硬预算保护默认开启；连续超限时停止媒体，冷却且回落到低水位后自动恢复。
            jvmProp 'ncpb.memory.protection', prop('ncpbMemoryProtection', 'true')
            jvmProp 'ncpb.memory.protection.owned_native_mib', prop('ncpbMemoryOwnedNativeLimitMiB', '512')
            jvmProp 'ncpb.memory.protection.gpu_pbo_mib', prop('ncpbMemoryGpuPboLimitMiB', '512')
            jvmProp 'ncpb.memory.protection.ffmpeg_mib', prop('ncpbMemoryFfmpegLimitMiB', '1024')
            jvmProp 'ncpb.memory.protection.d3d11_logical_mib', prop('ncpbMemoryD3d11LimitMiB', '2048')
            jvmProp 'ncpb.memory.protection.d3d11_surfaces', prop('ncpbMemoryD3d11SurfaceLimit', '256')
            jvmProp 'ncpb.memory.protection.sample_interval_ms', prop('ncpbMemoryProtectionSampleIntervalMs', '2000')
            jvmProp 'ncpb.memory.protection.consecutive_samples', prop('ncpbMemoryProtectionConsecutiveSamples', '15')
            jvmProp 'ncpb.memory.protection.cooldown_ms', prop('ncpbMemoryProtectionCooldownMs', '60000')
            jvmProp 'ncpb.memory.protection.recovery_ratio', prop('ncpbMemoryProtectionRecoveryRatio', '0.65')

            // 默认播放器优先使用已验证的 NV12 双平面路径；需要排查时可通过 -PncpbVideoRenderBackend=rgba/yuv420 回退。
            jvmProp 'ncpb.video.iris.force_yuv_shader', prop('ncpbIrisForceYuvShader', 'true')
            jvmProp 'ncpb.video.iris.allow_three_plane', prop('ncpbIrisAllowThreePlane', 'true')
            jvmProp 'ncpb.video.iris.program', prop('ncpbIrisYuvProgram', 'ENTITIES_TRANSLUCENT')
            jvmProp 'ncpb.video.iris.yuv_bypass', prop('ncpbIrisYuvBypass', 'true')
            // 实验：沿用 YUV/NV12 pipeline，但让 26.1 feature renderer 将其归入 solid/cutout 阶段。
            jvmProp 'ncpb.video.iris.force_solid_render_type', prop('ncpbIrisForceSolidRenderType', 'false')
            jvmArgument '-Dncpb.video.yuv.upload_planes=true'
            jvmProp 'ncpb.video.yuv.no_depth_write', prop('ncpbYuvNoDepthWrite', 'false')
            jvmProp 'ncpb.video.yuv.immediate_stage', prop('ncpbYuvImmediateStage', 'after_level')
            jvmProp 'ncpb.video.yuv.immediate_coords', prop('ncpbYuvImmediateCoords', 'camera_relative')
            jvmProp 'ncpb.video.yuv.immediate_pose', prop('ncpbYuvImmediatePose', 'identity')
            jvmProp 'ncpb.video.yuv.visibility_probe', prop('ncpbYuvVisibilityProbe', 'false')
            jvmProp 'ncpb.video.yuv.debug_log', prop('ncpbYuvDebugLog', 'false')
            def irisShaderKey = providers.gradleProperty('ncpbIrisShaderKey')
            if (irisShaderKey.isPresent()) {
                jvmProp 'ncpb.video.iris.shader_key', irisShaderKey.get()
            }
            def yuvShaderDebug = providers.gradleProperty('ncpbYuvShaderDebug')
            if (yuvShaderDebug.isPresent()) {
                jvmProp 'ncpb.video.yuv.shader_debug', yuvShaderDebug.get()
            }

            // 延迟测试 Bench：低频采样视频队列/上传/提交与 OpenAL 消费，不参与同步决策。
            jvmProp 'ncpb.playback.bench', prop('ncpbPlaybackLatencyBench', 'false')
            jvmProp 'ncpb.playback.bench.interval_ms', prop('ncpbPlaybackLatencyIntervalMs', '3000')

            // B站真实压力 Bench：按画质阶梯获取真实 DASH，测解码 + 上传 + 可选预览。
            jvmProp 'ncpb.video.real_bench', prop('ncpbRealBench', 'false')
            jvmProp 'ncpb.video.real_bench.managed', prop('ncpbRealBenchManaged', modBenchEnabled ? 'true' : 'false')
            jvmProp 'ncpb.video.real_bench.bv', prop('ncpbBenchVideo', 'BV1qM4y1w716')
            jvmProp 'ncpb.video.real_bench.frames', prop('ncpbRealBenchFrames', '12')
            jvmProp 'ncpb.video.real_bench.warmup_frames', prop('ncpbRealBenchWarmupFrames', '2')
            jvmProp 'ncpb.video.real_bench.output_format', prop('ncpbRealBenchOutputFormat', 'nv12')
            jvmProp 'ncpb.video.real_bench.preview', prop('ncpbRealBenchPreview', 'false')
            jvmProp 'ncpb.video.real_bench.realtime', prop('ncpbRealBenchRealtime', 'false')
            jvmProp 'ncpb.video.real_bench.max_fps', prop('ncpbRealBenchMaxFps', '30')
            jvmProp 'ncpb.video.real_bench.qualities', prop('ncpbRealBenchQualities', '16')
            jvmProp 'ncpb.video.real_media_lifecycle', prop('ncpbRealMediaLifecycle', 'false')
            jvmProp 'ncpb.video.real_media_lifecycle.rounds', prop('ncpbRealMediaLifecycleRounds', '100')
            jvmProp 'ncpb.video.real_media_lifecycle.cycle_timeout_ticks',
                    prop('ncpbRealMediaLifecycleCycleTimeoutTicks', '600')
            jvmProp 'ncpb.video.real_media_lifecycle.quality', prop('ncpbRealMediaLifecycleQuality', '16')

            // FFmpeg/native 解码默认参数；普通播放走平台 auto，必要时可用 -PncpbNativeHwaccel=d3d11va/vaapi/none 覆盖。
            jvmProp 'ncpb.video.native.hwaccel', prop('ncpbNativeHwaccel', 'auto')
            jvmProp 'ncpb.video.native.av1_first_frame_probe_timeout_ms',
                    prop('ncpbAv1FirstFrameProbeTimeoutMillis', '2000')
            jvmProp 'ncpb.video.native.av1_first_frame_probe_max_packets',
                    prop('ncpbAv1FirstFrameProbeMaxPackets', '256')
            // 需要排查“音频启动但视频未入场”时开启，输出 stop/wait/schedule 视频决策。
            jvmProp 'bili.video.turntable.log_sync_decisions', prop('ncpbVideoLogSyncDecisions', 'false')
            // 手持 MP4/Pad 视频默认保持原 native auto 行为；排查时可用 d3d11va/none 覆盖。
            jvmProp 'ncpb.mp4.video.native.hwaccel', prop('ncpbHandheldNativeHwaccel', 'auto')

            // CPU 彩条测试：跳过网络/FFmpeg，只验证渲染、上传、YUV shader 路径。
            jvmProp 'ncpb.video.cpu_bars', prop('ncpbCpuBars', 'false')

            // 多分辨率彩条压力 Bench：不走网络/FFmpeg，逐档验证 480p→8K 上传压力。
            jvmProp 'ncpb.video.render_bench', prop('ncpbRenderBench', 'false')
            jvmProp 'ncpb.video.render_bench.upload_mode', prop('ncpbRenderBenchUploadMode', 'nv12')
            jvmProp 'ncpb.video.render_bench.frames', prop('ncpbRenderBenchFrames', '120')
            jvmProp 'ncpb.video.render_bench.upload_fps_steps', prop('ncpbRenderBenchUploadFpsSteps', '30,24,15')

            // MP4 手持 GUI 输入校准：开发调试用，默认关闭；启用后显示校准贴图并采集九点映射。
            jvmProp 'ncpb.mp4.calibration', prop('ncpbMp4Calibration', 'false')
            // MP4 手持 GUI 输入命中：默认使用渲染层投影出的真实四角；排查时可用 -PncpbMp4ProjectedInput=false 回退旧估算。
            jvmProp 'ncpb.mp4.projected_input', prop('ncpbMp4ProjectedInput', 'true')
            // MP4 手持 GUI 主路径：使用 Minecraft GuiRenderer 离屏渲染，保留原版字体/控件渲染质量。
            jvmProp 'ncpb.mp4.offscreen_gui', prop('ncpbMp4OffscreenGui', 'true')

            // Pad 地图道路生成调试：输出服务端懒采样、节点、线段、Overlay 分发/接收日志。
            jvmProp 'ncpb.pad.road.debug_log', prop('ncpbPadRoadDebugLog', 'false')
            // Pad 手持视频 RenderDoc 诊断：打印视频层提交/跳过原因，并可叠加洋红 probe 方便抓帧定位。
            jvmProp 'ncpb.pad.video.debug_log', prop('ncpbPadVideoDebugLog', 'false')
            jvmProp 'ncpb.pad.video.renderdoc_probe', prop('ncpbPadVideoRenderDocProbe', 'false')
            // Pad 屏幕较小，默认请求 360P 视频流；需要对比可用 -PncpbPadVideoQuality=64/32/16 覆盖。
            jvmProp 'ncpb.pad.video.quality', prop('ncpbPadVideoQuality', '16')
            // Pad 视频 native 后端独立于 MP4；默认先走 CPU，避免影响已正常的 MP4，可用 auto/none/d3d11va 覆盖。
            jvmProp 'ncpb.pad.video.native.hwaccel', prop('ncpbPadVideoNativeHwaccel', 'none')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        padMapSamplerServerSelfTest {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ncpb.pad.map.server_self_test', 'true'
        }

        sceneEditorDedicatedServerSelfTest {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ncpb.scene_editor.server_self_test', 'true'
        }

        // 开发用 GameTest 服务端。
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // 如需隔离数据生成目录，可打开下面一行。
            // gameDirectory = project.file('run-data')

            // 生成本模组资源，并复用现有资源作为输入。
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 本地运行日志设置。
        configureEach {
            // 开发期保留注册表生命周期日志。
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 本地保持 DEBUG，正式包由运行环境控制日志级别。
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 将 main sourceSet 绑定到本模组 ID。
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 加入数据生成输出资源。
sourceSets.main.resources { srcDir 'src/generated/resources' }
// 显式声明测试目录，确保 Gradle/Buildship 在多根工作区中稳定导入测试源码模型。
sourceSets.test.java.setSrcDirs(['src/test/java'])
sourceSets.test.resources.setSrcDirs(['src/test/resources'])
// 云同步可能在 generated source root 中恢复 "NativeBundleCapabilities 2.java" 之类冲突副本。
// 这类文件不可能是合法编译单元，也不应被 Gradle/Buildship 当成第二份类型定义。
sourceSets.main.java.exclude { details -> details.file.name ==~ /.* \d+\.java/ }
sourceSets.test.java.exclude { details -> details.file.name ==~ /.* \d+\.java/ }

tasks.register("runWithRenderDoc", Exec) {
    def javaExecTask = tasks.withType(JavaExec).named("runClient").get()
    def javaHome = javaExecTask.javaLauncher.get().metadata.installationPath.asFile.absolutePath
    def renderDocCmd = providers.gradleProperty('renderDocCmd')
            .orElse('E:\\Program Files\\RenderDoc\\renderdoccmd.exe')
            .get()
    def wrapperJar = layout.projectDirectory.file('gradle/wrapper/gradle-wrapper.jar').asFile
    def workingDirPath = layout.projectDirectory.asFile.absolutePath
    def runClientArgs = ["runClient"]
    def renderDocOffscreenGui = providers.gradleProperty('renderDocOffscreenGui')
    if (renderDocOffscreenGui.isPresent()) {
        runClientArgs.add("-PncpbMp4OffscreenGui=${renderDocOffscreenGui.get()}")
    }
    def renderDocPadVideoDebugLog = providers.gradleProperty('renderDocPadVideoDebugLog')
    if (renderDocPadVideoDebugLog.isPresent()) {
        runClientArgs.add("-PncpbPadVideoDebugLog=${renderDocPadVideoDebugLog.get()}")
    }
    def renderDocPadVideoProbe = providers.gradleProperty('renderDocPadVideoProbe')
    if (renderDocPadVideoProbe.isPresent()) {
        runClientArgs.add("-PncpbPadVideoRenderDocProbe=${renderDocPadVideoProbe.get()}")
    }
    def renderDocPadVideoQuality = providers.gradleProperty('renderDocPadVideoQuality')
    if (renderDocPadVideoQuality.isPresent()) {
        runClientArgs.add("-PncpbPadVideoQuality=${renderDocPadVideoQuality.get()}")
    }
    def renderDocPadVideoNativeHwaccel = providers.gradleProperty('renderDocPadVideoNativeHwaccel')
    if (renderDocPadVideoNativeHwaccel.isPresent()) {
        runClientArgs.add("-PncpbPadVideoNativeHwaccel=${renderDocPadVideoNativeHwaccel.get()}")
    }
    def handheldNativeHwaccel = providers.gradleProperty('ncpbHandheldNativeHwaccel')
    if (handheldNativeHwaccel.isPresent()) {
        runClientArgs.add("-PncpbHandheldNativeHwaccel=${handheldNativeHwaccel.get()}")
    }

    doFirst {
        if (!new File(renderDocCmd).exists()) {
            throw new GradleException("RenderDoc command not found: ${renderDocCmd}. Override with -PrenderDocCmd=...")
        }
        if (!wrapperJar.exists()) {
            throw new GradleException("Gradle wrapper jar not found: ${wrapperJar.absolutePath}")
        }
    }

    commandLine = [
            renderDocCmd,
            "capture",
            "--opt-hook-children",
            "--wait-for-exit",
            "--working-dir",
            workingDirPath,
            "$javaHome/bin/java.exe",
            "-Xmx64m",
            "-Xms64m",
            "-Dorg.gradle.appname=gradlew",
            "-Dorg.gradle.java.home=$javaHome",
            "-classpath",
            wrapperJar.absolutePath,
            "org.gradle.wrapper.GradleWrapperMain"
    ] + runClientArgs
}


dependencies {
    // 通用场景编辑器核心的公开 API 暴露 JOML 只读/值类型，不能依赖 Minecraft 的传递 classpath。
    api 'org.joml:joml:1.10.8'
    // Scene Editor is published as an independent multi-module JitPack project. The host compiles against and embeds
    // the same immutable release, while NeoForge negotiates one compatible copy when several mods JiJ it.
    jarJar(api("com.github.zhongbai2333.SceneEditor:scene-editor-core:${scene_editor_version}")) {
        version {
            strictly '[1.0.0-beta.2,2.0.0)'
            prefer scene_editor_version
        }
    }
    jarJar(implementation("com.github.zhongbai2333.SceneEditor:scene-editor-minecraft:${scene_editor_version}")) {
        version {
            strictly '[1.0.0-beta.2,2.0.0)'
            prefer scene_editor_version
        }
    }

    compileOnly "maven.modrinth:net-music:mCrjhdSq"
    // neoforge.mods.toml declares NetMusic mandatory; every dev client/server run must therefore load it as well.
    runtimeOnly "maven.modrinth:net-music:mCrjhdSq"
    if (modBenchEnabled) {
        benchCompileOnly "maven.modrinth:net-music:mCrjhdSq"
    }
    compileOnly "maven.modrinth:iris:YEGDGnJM"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly "net.neoforged:neoforge:${neo_version}"
    // 测试直接构造 B站 API 的 JSON 响应，因此编译期也需要 gson。
    testImplementation 'com.google.code.gson:gson:2.13.1'

    if (terrainCompatMatrixEnabled) {
        def manifest = new groovy.json.JsonSlurper().parse(terrainCompatAssetManifestFile.asFile)
        manifest.assets.findAll { it.kind == 'mod' }.each { asset ->
            add('benchRuntimeMod', files(terrainCompatAssetDirectory.map { directory ->
                new File(directory, asset.file.toString())
            }))
        }
    }
}

if (modBenchEnabled) {
    modBench {
        targetMod = 'net_music_can_play_bili'
        expectedProviderCount = 1
        seed = 233
        phaseTimeoutTicks = realMediaLifecycleEnabled ? 72000 : terrainCompatMatrixEnabled ? 3600 : 1200
        clientWorldPreset = 'void'
        clientRequireWindowFocus = false
        if (providers.gradleProperty('ncpbLocalModBench').map { it.toBoolean() }.orElse(false).get()) {
            pairedClientCount = providers.gradleProperty('ncpbPairedClientCount')
                    .map { Integer.parseInt(it) }.orElse(1).get()
            pairedProjectProperties.put('enableModBench', 'true')
            pairedProjectProperties.put('ncpbLocalModBench', 'true')
            pairedProjectProperties.put('modbench_version', providers.gradleProperty('modbench_version').get())
            pairedProjectProperties.put('ncpbPairedClientCount', String.valueOf(pairedClientCount.get()))
            pairedProjectProperties.put('ncpbBuildDirectory', layout.buildDirectory.get().asFile.absolutePath)
            [
                    'ncpbVideoAdvancedFeatures', 'ncpbVideoBenchFeatures', 'ncpbRealBench',
                    'ncpbRealBenchManaged', 'ncpbBenchVideo', 'ncpbRealBenchFrames',
                    'ncpbRealBenchWarmupFrames', 'ncpbRealBenchQualities', 'ncpbRealBenchOutputFormat',
                    'ncpbRealBenchPreview', 'ncpbRealBenchRealtime', 'ncpbRealMediaLifecycle',
                    'ncpbRealMediaLifecycleRounds', 'ncpbRealMediaLifecycleCycleTimeoutTicks',
                    'ncpbRealMediaLifecycleQuality', 'ncpbNativeHwaccel',
                    'ncpbAv1FirstFrameProbeTimeoutMillis', 'ncpbAv1FirstFrameProbeMaxPackets',
                    'ncpbVideoRenderBackend',
                    'ncpbRealMp3Bench', 'ncpbRealMp3BenchUrl', 'enableTerrainCompatMatrix',
                    'ncpbTerrainCompatAssetDirectory'
            ].each { propertyName ->
                def propertyValue = providers.gradleProperty(propertyName).orNull
                if (propertyValue != null) {
                    pairedProjectProperties.put(propertyName, propertyValue)
                }
            }
        }
    }
    afterEvaluate {
        def benchProp = { name, defaultValue -> providers.gradleProperty(name).orElse(defaultValue).get() }
        ['benchClient', 'benchRemoteClient'].each { runName ->
            neoForge.runs.named(runName) {
                jvmArgument "--enable-native-access=${mod_id}"
                systemProperty 'ncpb.video.advanced_features', benchProp('ncpbVideoAdvancedFeatures', 'false')
                systemProperty 'ncpb.video.enable_bench_features', benchProp('ncpbVideoBenchFeatures', 'false')
                systemProperty 'ncpb.video.real_bench', benchProp('ncpbRealBench', 'false')
                systemProperty 'ncpb.video.real_bench.managed', benchProp('ncpbRealBenchManaged', 'true')
                systemProperty 'ncpb.video.real_bench.bv', benchProp('ncpbBenchVideo', 'BV1qM4y1w716')
                systemProperty 'ncpb.video.real_bench.frames', benchProp('ncpbRealBenchFrames', '12')
                systemProperty 'ncpb.video.real_bench.warmup_frames', benchProp('ncpbRealBenchWarmupFrames', '2')
                systemProperty 'ncpb.video.real_bench.qualities', benchProp('ncpbRealBenchQualities', '16')
                systemProperty 'ncpb.video.real_bench.output_format', benchProp('ncpbRealBenchOutputFormat', 'nv12')
                systemProperty 'ncpb.video.real_bench.preview', benchProp('ncpbRealBenchPreview', 'false')
                systemProperty 'ncpb.video.real_bench.realtime', benchProp('ncpbRealBenchRealtime', 'false')
                systemProperty 'ncpb.video.real_media_lifecycle', benchProp('ncpbRealMediaLifecycle', 'false')
                systemProperty 'ncpb.video.real_media_lifecycle.rounds',
                        benchProp('ncpbRealMediaLifecycleRounds', '100')
                systemProperty 'ncpb.video.real_media_lifecycle.cycle_timeout_ticks',
                        benchProp('ncpbRealMediaLifecycleCycleTimeoutTicks', '600')
                systemProperty 'ncpb.video.real_media_lifecycle.quality',
                        benchProp('ncpbRealMediaLifecycleQuality', '16')
                systemProperty 'ncpb.video.native.hwaccel', benchProp('ncpbNativeHwaccel', 'auto')
                systemProperty 'ncpb.video.native.av1_first_frame_probe_timeout_ms',
                        benchProp('ncpbAv1FirstFrameProbeTimeoutMillis', '2000')
                systemProperty 'ncpb.video.native.av1_first_frame_probe_max_packets',
                        benchProp('ncpbAv1FirstFrameProbeMaxPackets', '256')
                systemProperty 'ncpb.video.render.backend', benchProp('ncpbVideoRenderBackend', 'nv12')
                systemProperty 'ncpb.bili.audio.real_mp3_bench', benchProp('ncpbRealMp3Bench', 'false')
                systemProperty 'ncpb.bili.audio.real_mp3_bench.url', benchProp('ncpbRealMp3BenchUrl',
                        'https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3')
                if (terrainCompatMatrixEnabled) {
                    systemProperty 'ncpb.terrain.compat_matrix', 'true'
                }
            }
        }
    }

    def verifyTerrainCompatMatrixAssets = tasks.register('verifyTerrainCompatMatrixAssets') {
        group = 'verification'
        description = 'Verifies every pinned third-party terrain compatibility asset by exact size and SHA-512.'
        inputs.file(terrainCompatAssetManifestFile)
        inputs.dir(terrainCompatAssetDirectory)
        doLast {
            def manifest = new groovy.json.JsonSlurper().parse(terrainCompatAssetManifestFile.asFile)
            if (manifest.schemaVersion != 1 || manifest.minecraftVersion != '26.1.2'
                    || manifest.neoForgeVersion != terrainCompatNeoForgeVersion) {
                throw new GradleException("Unsupported terrain compatibility manifest header: ${manifest}")
            }
            def ids = new HashSet<String>()
            def names = new HashSet<String>()
            manifest.assets.each { asset ->
                def id = asset.id.toString()
                def name = asset.file.toString()
                if (!ids.add(id) || !names.add(name) || new File(name).name != name) {
                    throw new GradleException("Duplicate or unsafe terrain compatibility asset: ${asset}")
                }
                def assetFile = new File(terrainCompatAssetDirectory.get(), name)
                if (!assetFile.isFile()) {
                    throw new GradleException("Missing terrain compatibility asset ${id}: ${assetFile}. "
                            + 'Run tools/fetch_terrain_compat_matrix_assets.py first.')
                }
                def digest = java.security.MessageDigest.getInstance('SHA-512')
                assetFile.withInputStream { input ->
                    byte[] buffer = new byte[1024 * 1024]
                    int count
                    while ((count = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, count)
                    }
                }
                def actualHash = java.util.HexFormat.of().formatHex(digest.digest())
                if (assetFile.length() != (asset.bytes as long)
                        || !actualHash.equalsIgnoreCase(asset.sha512.toString())) {
                    throw new GradleException("Terrain compatibility asset ${id} failed verification: "
                            + "bytes=${assetFile.length()}, sha512=${actualHash}")
                }
            }
            logger.lifecycle('Verified {} pinned terrain compatibility assets in {}',
                    manifest.assets.size(), terrainCompatAssetDirectory.get())
        }
    }

    if (terrainCompatMatrixEnabled) {
        def stageTerrainCompatMatrixAssets = tasks.register('stageTerrainCompatMatrixAssets') {
            group = 'verification'
            description = 'Stages the pinned resource pack and Iris shaderpack for integrated and paired clients.'
            def pairedClientIndex = providers.gradleProperty('modBench.internal.clientIndex')
            dependsOn verifyTerrainCompatMatrixAssets, tasks.named(
                    pairedClientIndex.isPresent() ? 'prepareBenchRemoteClientOptions' : 'prepareBenchClientOptions')
            def selectedRunType = pairedClientIndex.zip(
                    providers.gradleProperty('modBench.internal.clientCount').orElse('1')) { index, count ->
                Integer.parseInt(count) == 1 ? 'remote-client' : "remote-client-${Integer.parseInt(index)}"
            }.orElse('client')
            def gameDirectory = layout.buildDirectory.dir(
                    selectedRunType.map { "modBench/runs/default/${it}" })
            inputs.file(terrainCompatAssetManifestFile)
            inputs.dir(terrainCompatAssetDirectory)
            outputs.dir(gameDirectory.map { it.dir('resourcepacks') })
            outputs.dir(gameDirectory.map { it.dir('shaderpacks') })
            // options.txt and Iris config are game-owned mutable files; always restore the pinned selection.
            outputs.upToDateWhen { false }
            doLast {
                def manifest = new groovy.json.JsonSlurper().parse(terrainCompatAssetManifestFile.asFile)
                def resourcePack = manifest.assets.find { it.kind == 'resource_pack' }
                def shaderPack = manifest.assets.find { it.kind == 'shader_pack' }
                if (resourcePack == null || shaderPack == null) {
                    throw new GradleException('Terrain compatibility manifest must contain one resource and shader pack')
                }
                [gameDirectory.get().asFile].each { gameDir ->
                    def resourcePackDirectory = new File(gameDir, 'resourcepacks')
                    def shaderPackDirectory = new File(gameDir, 'shaderpacks')
                    resourcePackDirectory.mkdirs()
                    shaderPackDirectory.mkdirs()
                    java.nio.file.Files.copy(
                            new File(terrainCompatAssetDirectory.get(), resourcePack.file.toString()).toPath(),
                            new File(resourcePackDirectory, resourcePack.file.toString()).toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    java.nio.file.Files.copy(
                            new File(terrainCompatAssetDirectory.get(), shaderPack.file.toString()).toPath(),
                            new File(shaderPackDirectory, shaderPack.file.toString()).toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)

                    def optionsFile = new File(gameDir, 'options.txt')
                    def lines = optionsFile.isFile() ? optionsFile.readLines('UTF-8') : []
                    def resourcePacksValue = groovy.json.JsonOutput.toJson(["file/${resourcePack.file}"])
                    // Iris 1.11.3 + Sodium 0.9.1 currently crashes its multi-player shadow pass on
                    // macOS with "Missing sampler Sampler1". The compatibility gate covers
                    // shader/world/media rendering, so pin both vanilla entity shadows and the
                    // pack's shadow program off without disabling the shaderpack itself.
                    def updated = lines.findAll {
                        !it.startsWith('resourcePacks:') && !it.startsWith('entityShadows:')
                    }
                    updated.add("resourcePacks:${resourcePacksValue}")
                    updated.add('entityShadows:false')
                    optionsFile.setText(updated.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')

                    def shaderOptions = new File(shaderPackDirectory, "${shaderPack.file}.txt")
                    shaderOptions.setText('SHADOW_CASTING=false' + System.lineSeparator(), 'UTF-8')

                    def irisConfig = new File(gameDir, 'config/iris.properties')
                    irisConfig.parentFile.mkdirs()
                    irisConfig.setText("""shaderPack=${shaderPack.file}
enableShaders=true
allowUnknownShaders=false
disableUpdateMessage=true
maxShadowRenderDistance=16
""", 'UTF-8')
                    logger.lifecycle('Staged resource pack {} and shaderpack {} in {}',
                            resourcePack.file, shaderPack.file, gameDir)
                }
            }
        }
        tasks.matching { it.name in ['runBenchClient', 'runBenchRemoteClient'] }.configureEach {
            dependsOn stageTerrainCompatMatrixAssets
        }
    }
}

