tasks.register('verifyEmbeddedNativeBundle') {
    group = 'verification'
    description = 'Verifies the exact six-platform native file set and every extracted-file SHA-256 in source and JAR.'
    dependsOn tasks.named('jar')
    inputs.dir(embeddedNativeRoot)
    inputs.file(productionJarArchive)
    doLast {
        def calculateSha256 = { InputStream input ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            byte[] buffer = new byte[64 * 1024]
            int count
            while ((count = input.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        def root = embeddedNativeRoot.asFile
        def manifestFile = embeddedNativeManifest.asFile
        if (!manifestFile.isFile()) {
            throw new GradleException("Missing embedded native manifest: ${manifestFile}")
        }

        def expectedPaths = embeddedNativeFiles.collectMany { platform, names ->
            names.collect { name -> "${platform}/${name}" }
        }.toSet()
        def manifestHashes = [:]
        manifestFile.readLines('UTF-8').eachWithIndex { rawLine, index ->
            def line = rawLine.trim()
            if (line.isEmpty()) {
                return
            }
            def matcher = line =~ /^([0-9a-f]{64})  ([A-Za-z0-9._\/-]+)$/
            if (!matcher.matches()) {
                throw new GradleException("Invalid native SHA256SUMS line ${index + 1}: ${rawLine}")
            }
            def path = matcher.group(2)
            if (path.startsWith('/') || path.contains('..') || manifestHashes.containsKey(path)) {
                throw new GradleException("Unsafe or duplicate native manifest path: ${path}")
            }
            manifestHashes[path] = matcher.group(1)
        }
        if (manifestHashes.keySet() != expectedPaths) {
            throw new GradleException("Native manifest file set mismatch: missing=${expectedPaths - manifestHashes.keySet()}, "
                    + "unexpected=${manifestHashes.keySet() - expectedPaths}")
        }

        def sourcePaths = [] as Set
        root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            def relative = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            if (embeddedNativeFiles.keySet().any { platform -> relative.startsWith("${platform}/") }) {
                sourcePaths.add(relative)
            }
        }
        if (sourcePaths != expectedPaths) {
            throw new GradleException("Embedded native source file set mismatch: missing=${expectedPaths - sourcePaths}, "
                    + "unexpected=${sourcePaths - expectedPaths}")
        }
        manifestHashes.each { path, expectedHash ->
            def file = new File(root, path)
            if (java.nio.file.Files.isSymbolicLink(file.toPath())) {
                throw new GradleException("Embedded native file must not be a symlink: ${path}")
            }
            def actualHash = file.newInputStream().withCloseable { input -> calculateSha256(input) }
            if (actualHash != expectedHash) {
                throw new GradleException("Embedded native SHA-256 mismatch: ${path}, expected=${expectedHash}, actual=${actualHash}")
            }
        }

        new java.util.zip.ZipFile(productionJarArchive.get().asFile).withCloseable { zip ->
            def packagedManifest = zip.getEntry('native/SHA256SUMS')
            if (packagedManifest == null) {
                throw new GradleException('Production JAR is missing native/SHA256SUMS')
            }
            def jarPaths = zip.entries().findAll { entry ->
                !entry.directory && embeddedNativeFiles.keySet().any { platform ->
                    entry.name.startsWith("native/${platform}/")
                }
            }.collect { entry -> entry.name.substring('native/'.length()) }.toSet()
            if (jarPaths != expectedPaths) {
                throw new GradleException("Packaged native file set mismatch: missing=${expectedPaths - jarPaths}, "
                        + "unexpected=${jarPaths - expectedPaths}")
            }
            manifestHashes.each { path, expectedHash ->
                def entry = zip.getEntry("native/${path}")
                def actualHash = zip.getInputStream(entry).withCloseable { input -> calculateSha256(input) }
                if (actualHash != expectedHash) {
                    throw new GradleException("Packaged native SHA-256 mismatch: ${path}, expected=${expectedHash}, actual=${actualHash}")
                }
            }
        }
    }
}

tasks.register('verifyProductionJarLegalMaterials') {
    group = 'verification'
    description = 'Verifies native legal materials are packaged and included in generated release notes.'
    dependsOn tasks.named('jar')
    inputs.file(productionJarArchive)
    inputs.file(nativeCapabilityNotice)
    inputs.file(releaseWorkflow)
    doLast {
        def archive = productionJarArchive.get().asFile
        def platforms = [
                'linux-arm64', 'linux-x86_64',
                'macos-arm64', 'macos-x86_64',
                'windows-arm64', 'windows-x86_64'
        ]
        def requiredEntries = [
                'META-INF/licenses/AOMedia-Patent-License-1.0.txt',
                'META-INF/THIRD-PARTY-NOTICES.md',
                'native/README.md',
                'native/SHA256SUMS'
        ] + platforms.collectMany { platform ->
            embeddedNativeLicenses.collect { license -> "native/${platform}/${license}" }
        }
        def missing = []
        def empty = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            requiredEntries.each { path ->
                def entry = zip.getEntry(path)
                if (entry == null) {
                    missing.add(path)
                } else {
                    zip.getInputStream(entry).withCloseable { input ->
                        if (input.readAllBytes().length == 0) {
                            empty.add(path)
                        }
                    }
                }
            }
        }
        if (!missing.isEmpty() || !empty.isEmpty()) {
            throw new GradleException("Production JAR legal materials invalid: missing=${missing}, empty=${empty}")
        }

        def noticeText = nativeCapabilityNotice.asFile.getText('UTF-8')
        def requiredNoticeMarkers = [
                'media-min-v48',
                'AV1 仅支持平台硬件解码',
                '不包含 dav1d 或 libaom',
                'H.264 硬件或软件解码',
                'HEVC/H.265',
                "Linux ARM64 要求宿主 glibc 至少提供 `${linuxArm64GlibcFloor}`",
                "Linux x86_64 至少提供 `${linuxX8664GlibcFloor}`",
                'FFmpeg 使用 LGPL v2.1',
                'AOMedia Patent License 1.0'
        ]
        def absentMarkers = requiredNoticeMarkers.findAll { marker -> !noticeText.contains(marker) }
        if (!absentMarkers.isEmpty()) {
            throw new GradleException("Native capability notice is incomplete: missing markers=${absentMarkers}")
        }

        new java.util.zip.ZipFile(productionJarArchive.get().asFile).withCloseable { zip ->
            def nativeReadme = zip.getInputStream(zip.getEntry('native/README.md')).withCloseable { input ->
                new String(input.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            }
            def requiredRuntimeMarkers = [
                    "`${linuxArm64GlibcFloor}` on Linux ARM64",
                    "`${linuxX8664GlibcFloor}` on Linux x86_64"
            ]
            def missingRuntimeMarkers = requiredRuntimeMarkers.findAll { marker -> !nativeReadme.contains(marker) }
            if (!missingRuntimeMarkers.isEmpty()) {
                throw new GradleException(
                        "Packaged native README is missing Linux runtime floors: ${missingRuntimeMarkers}")
            }
        }

        def workflowText = releaseWorkflow.asFile.getText('UTF-8')
        if (!workflowText.contains("readFileSync('docs/release-native-capabilities.md'")) {
            throw new GradleException('GitHub release notes do not include docs/release-native-capabilities.md')
        }
    }
}

