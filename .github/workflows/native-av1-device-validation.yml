name: Native AV1 hardware device validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Exact native bundle and runner platform
        required: true
        type: choice
        options:
          - linux-arm64
          - linux-x86_64
          - macos-arm64
          - macos-x86_64
          - windows-arm64
          - windows-x86_64
      runner_label:
        description: Dedicated self-hosted runner label for the physical GPU/driver device
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-av1-device-${{ inputs.platform }}-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  validate-hardware-device:
    name: AV1 hardware decode (${{ inputs.platform }} / ${{ inputs.runner_label }})
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up native Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Verify runner, bundle identity, loadability, JNI exports and FFmpeg runtime
        run: python tools/verify_native_runtime.py --platform "${{ inputs.platform }}"

      - name: Decode initial and 35-second seek fragments on the physical hardware backend
        run: python tools/verify_native_av1_smoke.py --platform "${{ inputs.platform }}" --hwaccel auto --report "build/reports/native-av1-device/${{ inputs.platform }}.json"

      - name: Archive signed-off device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-av1-device-${{ inputs.platform }}-${{ inputs.runner_label }}
          path: build/reports/native-av1-device/${{ inputs.platform }}.json
          if-no-files-found: error
          retention-days: 90
