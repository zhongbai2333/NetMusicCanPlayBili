pluginManagement {
    repositories {
        if (providers.gradleProperty('ncpbLocalModBench').map { it.toBoolean() }.orElse(false).get()) {
            mavenLocal {
                content { includeGroup 'com.github.zhongbai2333.BenchMod' }
            }
        }
        // ModBench 通过 JitPack 的不可变 tag 发布；日常构建仍默认不应用插件。
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.zhongbai2333.BenchMod'
            }
        }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    plugins {
        id 'com.zhongbai233.minecraft-bench' version providers.gradleProperty('modbench_version').get()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.zhongbai233.minecraft-bench') {
                useModule("com.github.zhongbai2333.BenchMod:bench-gradle-plugin:${requested.version}")
            }
        }
    }
}

plugins {
    // Gradle 9 使用 1.0.0+；daemon JVM 标准会让 wrapper 和 IDE 自动选择 Java 25。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'net-music-can-play-bili'
